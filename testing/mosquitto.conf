# ─────────────────────────────────────────────────────────────────
#  Vaayu Hub — Mosquitto broker configuration
#
#  This file enables TWO listeners:
#    • Port 1883 — standard MQTT  (used by ESP32 firmware & simulate.py)
#    • Port 9001 — MQTT over WebSockets  (used by the React Native
#      dashboard app via mqtt.js / ws://)
#
#  Run with:  mosquitto -c mosquitto.conf
# ─────────────────────────────────────────────────────────────────

# ── Standard MQTT listener (firmware, Python scripts) ────────────
listener 1883
allow_anonymous true

# ── WebSocket MQTT listener (dashboard / browser clients) ────────
listener 9001
protocol websockets
allow_anonymous true
