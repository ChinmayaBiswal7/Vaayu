; ============================================================
; Vaayu Hub — PlatformIO configuration
; Target: ESP32-S3 DevKitC-1
; ============================================================

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Use USB-CDC for flashing / serial on ESP32-S3
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SHT4x Library @ ^1.0.3
    milesburton/DallasTemperature @ ^3.11.0
    paulstoffregen/OneWire @ ^2.3.8
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    knolleary/PubSubClient @ ^2.8.0
    bblanchon/ArduinoJson @ ^7.0.4

; Partition scheme with enough OTA space
board_build.partitions = default_8MB.csv

; Native environment for running unit tests directly on PC (no ESP32 required)
[env:native]
platform = native
test_framework = unity
build_flags =
    -DUNIT_TEST

